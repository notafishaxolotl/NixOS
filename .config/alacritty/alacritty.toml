
[colors.bright]
black = "#1C252C"
blue = "#6791C9"
cyan = "#67AFC1"
green = "#78B892"
magenta = "#BC83E3"
red = "#DF5B61"
white = "#D9D7D6"
yellow = "#DE8F78"

[colors.cursor]
cursor = "#d9d7d6"
text = "CellForeground"

[colors.normal]
black = "#484e5b"
blue = "#79aaeb"
cyan = "#7acfe4"
green = "#8cd7aa"
magenta = "#c488ec"
red = "#f16269"
white = "#e5e5e5"
yellow = "#e9967e"

[colors.primary]
background = "#061115"
foreground = "#D9D7D6"

[cursor]
style = "Underline"
vi_mode_style = "Underline"

[env]
TERM = "xterm-256color"

[font]
size = 10

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Iosveka Nerd Font"
style = "Italic"

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[window]
dynamic_padding = true

[window.padding]
x = 12
y = 12

[general]
live_config_reload = true
